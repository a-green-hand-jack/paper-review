[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-review-harbor"
version = "0.3.0"
description = "Turn papers into standard Harbor tasks for evaluating paper review agents"
readme = "docs/PAPER2HARBOR.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]
publish = [
  "huggingface-hub>=0.25",
]

[project.scripts]
pre-harbor = "paper_review_harbor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_review_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
