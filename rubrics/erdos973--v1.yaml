paper:
  slug: erdos973
  version: v1
  venue: arxiv
  domain: mathematics
  hybrid_numerical: false

status: draft
annotator: null
annotated_at: null

notes: >-
  DRAFT. Nothing here is ground truth until a person signs it off with
  /annotate. Every finding below was derived from the v1 -> v2 diff, so each
  one names a change the authors themselves made; that makes them real, but it
  does not make them well phrased. The two worth arguing about first are F1
  (is the framing a defect or an editorial preference?) and F5 (probably too
  minor to keep). F2 and F3 are the load-bearing ones and are proposed as
  gating.

  Scout confidence: F2 high, F3 high, F4 high, F6 high, F7 medium, F1 medium,
  F5 low.

provenance:
  - kind: version-diff
    detail: >-
      v2 adds "Finally, r_n <= n/sqrt2 for every n>=2, witnessed by P(t)=1-t^n,
      and consequently lim r_n^{1/n}=1", which is F2.
  - kind: version-diff
    detail: >-
      v2 inserts "independent of the choice of the zero" and "Since beta =
      beta_{j,ell} was an arbitrary zero of G_j, it follows that" into the
      separation lemma, and drops a stray "= delta" from the display. That is
      F3 and F4's neighbour.
  - kind: version-diff
    detail: >-
      v2 retitles from "A Stable-Residual Principle and an Alternative Proof of
      the Negative Answer to Erdos Problem 973" to "Stable residuals of
      Schur-stable polynomials and exterior power sums", and adds "we do not
      claim priority for the negative answer to Problem 973" to the
      introduction. That is F1.
  - kind: version-diff
    detail: >-
      v2 changes "This proves the asserted lower bound in Theorem 1.1" to "the
      qualitative assertion" (F5's sibling, kept as F4), replaces two bare
      "arXiv:2607.22017" references with \cite{LuoYangZhu2026} (F6), and
      rewrites the automated-assistance disclosure to name the second system
      and assert independent verification (F7).

findings:
  - id: F1
    title: Theorem 1.1 asserts a limit that its own lower bound cannot give
    severity: blocking
    gating: true
    detectability: medium
    protocols: [offline, online]
    location: "main.tex:212-215 (Theorem 1.1), restated main.tex:87 (abstract)"
    claim: >-
      states the lower bound r_n >= exp(-D n^{2/3} (log(en))^{2/3}) and then
      concludes "In particular, lim_{n->infty} r_n^{1/n} = 1".
    defect: >-
      A lower bound on r_n bounds the limit inferior only. Concluding that
      r_n^{1/n} converges to 1 also needs limsup r_n^{1/n} <= 1, which requires
      an upper bound on r_n. The manuscript never states one, so the "in
      particular" does not follow from what precedes it. The abstract repeats
      the same inference.
    accept_if: |
      Observes that the limit r_n^{1/n} -> 1 does not follow from the stated
      lower bound alone, because a lower bound controls only the limit
      inferior, and that an upper bound on r_n is needed and is missing. Credit
      a review that identifies the missing upper bound even if it does not
      supply one, and credit a review that supplies one (n/sqrt2, witnessed by
      P(t) = 1 - t^n, is the obvious choice).
    reject_if: |
      Merely observes that Theorem 1.1 is stated tersely, or asks for more
      detail in the proof, without identifying that the limit claim needs a
      bound in the opposite direction.

  - id: F2
    title: Separation lemma fixes its threshold after fixing the zero, then quantifies over all zeros
    severity: major
    gating: true
    detectability: low
    protocols: [offline, online]
    location: "main.tex:599-605 (end of the zero-separation lemma)"
    claim: >-
      derives delta >= c - (2 + log(2 sqrt(n_j+1)))/n_j for a zero beta of G_j,
      says "there exists j_0 >= j_1 such that the right-hand side is at least
      c/2 whenever j >= j_0", and concludes "Hence, for every j >= j_0 and
      1 <= ell <= n_j, 1 - Re beta_{j,ell} >= c/2".
    defect: >-
      The argument fixes a zero first and chooses j_0 afterwards, so as written
      j_0 may depend on which zero was chosen. The conclusion then quantifies
      over all n_j zeros at that same j_0, which the derivation has not
      established. The bound happens to be uniform because the right-hand side
      does not involve beta, but the proof never says so, and uniformity in ell
      is exactly what the rest of the argument relies on.
    accept_if: |
      Identifies that the threshold j_0 is selected for a particular zero while
      the conclusion is asserted uniformly over all zeros, and that the
      manuscript does not establish that uniformity. Credit a review that says
      the quantifier order is wrong, or that the choice of j_0 must be shown
      independent of the zero, or that the step from a fixed beta to "for every
      1 <= ell <= n_j" is unjustified as written.
    reject_if: |
      Generic remarks that the proof of this lemma is terse or hard to follow,
      or objections to the estimate itself rather than to the order in which
      the quantifiers are taken.

  - id: F3
    title: Proof announces it has established the lower bound when only the qualitative claim is proved
    severity: major
    gating: false
    detectability: medium
    protocols: [offline, online]
    location: "main.tex:882-883"
    claim: >-
      concludes the moment-contradiction argument with "This proves the
      asserted lower bound in Theorem 1.1", and only then begins "For the
      quantitative bound, fix 0 < c <= 1 and n >= 2".
    defect: >-
      At that point the argument has established the qualitative statement
      rho(P) > e^{-cn}, not the quantitative bound
      r_n >= exp(-D n^{2/3} (log(en))^{2/3}) that Theorem 1.1 also asserts. The
      sentence claims a result the following paragraph then sets out to prove,
      so a reader tracking what has been established is misled about the state
      of the proof.
    accept_if: |
      Notes that the manuscript declares the lower bound proved before the
      quantitative bound has been established, or equivalently that this
      sentence should refer only to the qualitative assertion. Credit a review
      that points out the mismatch between what the sentence claims and what
      the argument up to that point supports.
    reject_if: |
      General complaints that the proof is hard to follow or that Theorem 1.1
      bundles several statements together, without identifying that this
      specific sentence overstates what has been proved.

  - id: F4
    title: Stray "= delta" in the separation display contradicts the surrounding quantification
    severity: minor
    gating: false
    detectability: medium
    protocols: [offline, online]
    location: "main.tex:604"
    claim: >-
      displays "1 - Re beta_{j,ell} = delta >= c/2".
    defect: >-
      delta was introduced for the single fixed zero under discussion, so
      writing it as equal to 1 - Re beta_{j,ell} for every ell asserts that all
      zeros have the same real part. Only the inequality is intended.
    accept_if: |
      Points out that the equality with delta in this display is wrong or
      spurious, because delta refers to one particular zero while the display
      ranges over all of them, and that only the inequality is meant.
    reject_if: |
      Any general remark about notation being overloaded, without naming this
      display.

  - id: F5
    title: Front matter frames the paper around a result whose priority the body disclaims
    severity: minor
    gating: false
    detectability: high
    protocols: [offline, online]
    location: "main.tex:25-27 (title), main.tex:116 (introduction), main.tex:251"
    claim: >-
      titles itself "A Stable-Residual Principle and an Alternative Proof of
      the Negative Answer to Erdos Problem 973" and opens the introduction with
      "We give an alternative proof that the answer is negative", while the
      body states that Corollary 1.3 "is exactly the stronger, unnormalized
      conclusion already proved in [LuoYangZhu2026]" and that no priority is
      claimed.
    defect: >-
      The title and opening foreground a result the paper explicitly does not
      claim, while Theorem 1.1, which is the actual new contribution, appears
      only as a mechanism inside that framing. A reader meeting the paper by
      title and first paragraph forms the wrong view of what it contributes.
    accept_if: |
      Observes that the title and introduction present the Erdos Problem 973
      result as the paper's headline while the paper itself concedes that
      result to prior work, and that the genuinely new contribution
      (Theorem 1.1, the stable-residual bound) is thereby obscured. Credit a
      review that recommends reframing around the stable-residual theorem.
    reject_if: |
      Merely suggesting that related work be discussed more fully, or that the
      relationship to Luo-Yang-Zhu be clarified, when the manuscript already
      states it plainly.

  - id: F6
    title: Prior work referenced by bare arXiv identifier instead of its bibliography entry
    severity: minor
    gating: false
    detectability: high
    protocols: [offline, online]
    location: "main.tex:251, main.tex:1273"
    claim: >-
      writes "compares the present argument with arXiv:2607.22017 in detail"
      and "no claim of theorem priority over arXiv:2607.22017 is made", while
      citing the same work as \cite{LuoYangZhu2026} elsewhere.
    defect: >-
      The same work is referred to two different ways, one of which bypasses
      the bibliography entirely. A reader cannot tell from these sentences that
      the arXiv identifier and the cited reference are the same paper.
    accept_if: |
      Points out that the manuscript refers to prior work by raw arXiv number
      in the running text rather than through its bibliography key, and that
      this is inconsistent with how the same work is cited elsewhere.
    reject_if: |
      General bibliography-formatting complaints not tied to these references.

  - id: F7
    title: Automated-assistance disclosure leaves the systems used unnamed
    severity: minor
    gating: false
    detectability: medium
    protocols: [offline, online]
    location: "main.tex:1310-1318"
    claim: >-
      discloses that "OpenAI GPT-5.6 Sol was used during proof exploration and
      drafting; other generative AI systems were used for adversarial checking,
      literature comparison, and language editing".
    defect: >-
      "Other generative AI systems" names nothing, so the disclosure cannot be
      acted on: a reader cannot tell what was used for the adversarial checking
      and literature comparison, which are the roles where an unverified model
      output would matter most. The paragraph also does not state that the
      authors independently checked the resulting mathematical and
      bibliographic claims.
    accept_if: |
      Observes that the automated-assistance statement is incomplete, either
      because the systems used for checking and literature comparison are not
      named, or because it does not say that the authors independently verified
      what those systems produced.
    reject_if: |
      Objecting to the use of automated assistance as such, or asking for the
      disclosure to be removed.

distractors:
  - id: D1
    description: >-
      The manuscript uses the amsart document class with letterpaper geometry
      rather than a journal's own class.
    why_not_a_defect: >-
      This is an arXiv preprint. Class and page geometry are submission
      details, not properties of the work.
  - id: D2
    description: >-
      The paper reports no experiments, datasets, baselines or ablations.
    why_not_a_defect: >-
      It is a self-contained proof paper and claims nothing empirical.
      Asking for experiments here is the ML-shaped review frame that
      docs/DOMAIN_PROFILE_DESIGN.md exists to prevent.
  - id: D3
    description: >-
      One author is listed with an email address while the others are not, and
      affiliations are given at varying levels of detail.
    why_not_a_defect: >-
      Front-matter inconsistency of this kind is a copy-editing matter, not
      something a peer review is for.
